name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Tests/AI-Agent-Backend.Tests.csproj --no-build --configuration Release --verbosity normal
        env:
          ASPNETCORE_ENVIRONMENT: Development
          AzureOpenAI__Endpoint: https://placeholder.openai.azure.com/
          AzureOpenAI__ApiKey: placeholder-key-for-ci
          AzureOpenAI__DeploymentName: placeholder-deployment